# ===============================================
# 🎙️ Mongolian Whisper Backend — Render Config
# Version: v2.0 (Persistent Dataset + Intention Archive)
# ===============================================

services:
  - type: web
    name: mongolian-whisper-api
    env: python
    plan: starter
    region: oregon

    buildCommand: |
      set -eux
      apt-get update
      apt-get install -y ffmpeg
      python -m pip install --upgrade pip
      # ✅ Force clean deps so pins take effect (fixes sklearn 1.5.2 sticking)
      python -m pip uninstall -y scikit-learn joblib || true
      python -m pip install --no-cache-dir -r requirements.txt
      python -m pip show scikit-learn || true

    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT

    envVars:
      # 🔧 Model + runtime config
      - key: HF_MODEL
        value: WHISPER_CT2_PRODUCTION_V2_INT8
        # NOTE:
        # - If your app.py uses HF Whisper (transformers) -> set HF repo here (Tiny_HF)
        # - If your app.py uses faster-whisper CT2 -> set CT2 repo/path here (Small_CT2)

      - key: DEVICE
        value: cpu
      - key: COMPUTE_TYPE
        value: int8
      - key: DIAG
        value: "1"

      # 🧱 Dataset path (mounted persistent disk)
      - key: DATA_DIR
        value: /opt/render/project/src/local_persistent/record_archive

      # (Optional but useful)
      - key: MAX_UPLOAD_BYTES
        value: "10485760"   # 10 MB
      - key: MAX_DURATION_SEC
        value: "30"         # 30 seconds

      # ✅ Add this if your intent router loads domain_model.json from disk
      # (Only if your code expects it; otherwise ignore)
      # - key: DOMAIN_MODEL_PATH
      #   value: /opt/render/project/src/intention/domain_model.json

    # 💾 Persistent disk
    disk:
      name: whisper_dataset_storage
      mountPath: /opt/render/project/src/local_persistent
      sizeGB: 1

    # 🩺 Health check
    healthCheckPath: /
    healthCheckTimeout: 120
