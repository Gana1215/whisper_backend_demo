services:
  - type: web
    name: mongolian-whisper-api
    env: python
    plan: starter
    region: oregon
    buildCommand: |
      # 🧠 Ensure git-lfs pulls real model files (not pointer stubs)
      apt-get update && apt-get install -y git-lfs
      git lfs install
      git lfs pull

      # ⚙️ Upgrade pip to latest to ensure wheel compatibility
      pip install --upgrade pip

      # 📦 Install project dependencies
      pip install -r requirements.txt

    startCommand: uvicorn app:app --host 0.0.0.0 --port 10000

    envVars:
      # ✅ Your model directory inside the repo
      - key: MODEL_DIR
        value: models/MN_Whisper_Small_CT2

      # ⚙️ Device configuration (CPU for Render Starter plan)
      - key: DEVICE
        value: cpu

      # ⚙️ Quantization for faster CPU inference
      - key: COMPUTE_TYPE
        value: int8

      # 🧩 Optional diagnostic flag (print memory + LFS verification)
      - key: DIAG
        value: "1"

      # 🐍 Python version
      - key: PYTHON_VERSION
        value: 3.9.6
