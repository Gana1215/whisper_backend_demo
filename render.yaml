services:
  - type: web
    name: mongolian-whisper-api
    env: python
    plan: starter
    region: oregon
    buildCommand: |
      apt-get update && apt-get install -y ffmpeg
      pip install --upgrade pip
      # Install matching CT2 + faster-whisper versions
      pip install --upgrade ctranslate2==4.0.0 faster-whisper==1.0.3
      pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port 10000
    envVars:
      - key: MODEL_DIR
        value: models/MN_Whisper_Small_CT2
      - key: DEVICE
        value: cpu
      - key: COMPUTE_TYPE
        value: int8
