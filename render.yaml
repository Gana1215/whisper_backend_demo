services:
  - type: web
    name: mongolian-whisper-api
    env: python
    plan: starter
    region: oregon

    buildCommand: |
      echo "🚀 Starting build setup..."
      apt-get update && apt-get install -y ffmpeg
      echo "📦 Upgrading pip, setuptools, and wheel..."
      pip install --upgrade pip setuptools wheel
      echo "🔍 Checking pip version after upgrade:"
      pip --version
      echo "📥 Installing dependencies from requirements.txt..."
      pip install -r requirements.txt
      echo "✅ Build complete."

    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.9.6
      - key: MODEL_DIR
        value: models/MN_Whisper_Small_CT2
      - key: DEVICE
        value: cpu
      - key: COMPUTE_TYPE
        value: int8
      - key: DIAG
        value: "1"
