# ===============================================
# 🎙️ Mongolian Whisper Backend — Render Config
# Version: v2.0 (Persistent Dataset + Intention Archive)
# ===============================================

services:
  - type: web
    name: mongolian-whisper-api
    env: python
    plan: starter
    region: oregon

    buildCommand: |
      apt-get update && apt-get install -y ffmpeg
      pip install --upgrade pip
      pip install -r requirements.txt

    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT

    envVars:
      # 🔧 Model + runtime config
      - key: HF_MODEL
        value: gana1215/MN_Whisper_Small_CT2
      - key: DEVICE
        value: cpu
      - key: COMPUTE_TYPE
        value: int8
      - key: DIAG
        value: "1"

      # 🧱 Phase 1 dataset path (used by app.py)
      #    Point it inside the mounted persistent folder
      - key: DATA_DIR
        value: /opt/render/project/src/local_persistent/record_archive

      # (Optional but useful)
      - key: MAX_UPLOAD_BYTES
        value: "10485760"   # 10 MB
      - key: MAX_DURATION_SEC
        value: "30"         # 30 seconds

    # 💾 Persistent disk (stores BOTH Phase 1 and Phase 2 archives)
    disk:
      name: whisper_dataset_storage
      mountPath: /opt/render/project/src/local_persistent
      sizeGB: 1

    # 🩺 Health check — ensures API is responsive
    healthCheckPath: /
    healthCheckTimeout: 120
